<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <title>Raptors Play-by-Play</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101114;
        --surface: #1b1c20;
        --surface-raised: #24252a;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f5f5f6;
        --muted: #a4a5aa;
        --raptors: #ce1141;
        --away: #4b78d1;
        --progress: 0%;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(16px, 4vw, 48px);
        display: grid;
        place-items: center;
        background: #08090b;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .player { width: min(1440px, 100%); }
      .game-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px 24px;
        margin-bottom: 16px;
      }
      .game-title {
        margin: 0;
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 650;
        letter-spacing: -0.04em;
      }
      .game-details {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .broadcast {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 300px;
        overflow: hidden;
        background: var(--background);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
      }
      .broadcast-screen { position: absolute; inset: 0; background: #101114; }
      .broadcast-callout {
        position: absolute;
        left: clamp(18px, 4vw, 56px);
        top: clamp(18px, 4vw, 52px);
        right: clamp(18px, 4vw, 56px);
        max-width: min(900px, calc(100% - 140px));
        padding: 12px 18px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        background: rgba(21, 22, 26, 0.78);
        color: var(--text);
        font-size: clamp(18px, 2vw, 30px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.03em;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 180ms ease, transform 180ms ease;
        pointer-events: none;
      }
      .broadcast-callout.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .scorebug {
        position: absolute;
        left: clamp(18px, 4vw, 56px);
        bottom: clamp(18px, 4vw, 52px);
        display: grid;
        grid-template-columns: minmax(155px, 1fr) minmax(155px, 1fr) auto;
        align-items: stretch;
        max-width: calc(100% - 36px);
        min-height: 82px;
        overflow: hidden;
        background: rgba(25, 26, 30, 0.97);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
      }
      .team {
        display: grid;
        grid-template-columns: 4px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        min-width: 0;
        padding: 14px 18px 14px 0;
      }
      .team + .team { border-left: 1px solid var(--line); }
      .team-accent { align-self: stretch; background: var(--raptors); }
      .team.away .team-accent { background: var(--away); }
      .team-info { min-width: 0; }
      .team-label {
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.2;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .team-name {
        margin-top: 5px;
        overflow: hidden;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .score {
        padding-left: 6px;
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        letter-spacing: -0.06em;
        line-height: 1;
      }
      .game-state {
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        background: var(--surface-raised);
        border-left: 1px solid var(--line);
      }
      .period, .clock { display: grid; gap: 4px; text-align: center; }
      .clock { min-width: 65px; }
      .period-label, .clock-label {
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .period-value { font-size: 16px; font-weight: 700; white-space: nowrap; }
      .clock-value {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .broadcast-label {
        position: absolute;
        top: 20px;
        right: 22px;
        color: rgba(255, 255, 255, 0.36);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .controls {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        padding: 16px 4px 0;
      }
      .transport { display: flex; align-items: center; gap: 9px; }
      .control-button {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        padding: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
      }
      .control-button:hover { background: var(--surface); border-color: rgba(255,255,255,.28); }
      .control-button:active { transform: scale(.96); }
      .control-button:focus-visible, .timeline:focus-visible, .speed-select:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      .control-button.primary {
        width: 44px;
        height: 44px;
        color: #fff;
        background: var(--raptors);
        border-color: var(--raptors);
      }
      .control-button.primary:hover { background: #e0194c; }
      .control-button svg { width: 16px; height: 16px; fill: currentColor; }
      .control-button.primary svg { width: 18px; height: 18px; }
      .pause-icon { display: none; }
      .is-playing .play-icon { display: none; }
      .is-playing .pause-icon { display: block; }

      .timeline-wrap {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 42px;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .timeline-time {
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .timeline-time:last-child { text-align: right; }
      .timeline {
        width: 100%;
        height: 16px;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }
      .timeline::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 99px;
        background: linear-gradient(to right, var(--raptors) 0 var(--progress), rgba(255,255,255,.2) var(--progress) 100%);
      }
      .timeline::-moz-range-track { height: 3px; border-radius: 99px; background: rgba(255,255,255,.2); }
      .timeline::-moz-range-progress { height: 3px; border-radius: 99px; background: var(--raptors); }
      .timeline::-webkit-slider-thumb {
        width: 12px;
        height: 12px;
        margin-top: -4.5px;
        appearance: none;
        border: 0;
        border-radius: 50%;
        background: var(--text);
      }
      .timeline::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text); }
      .speed-select {
        min-width: 58px;
        padding: 8px 22px 8px 9px;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .speed-select option { color: var(--text); background: var(--surface); }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 620px) {
        body { padding: 0; place-items: stretch; }
        .player { width: 100%; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
        .game-heading { align-items: flex-start; flex-direction: column; gap: 4px; margin: 0; padding: 16px; }
        .broadcast { width: 100%; min-height: 58svh; aspect-ratio: auto; border: 0; border-radius: 0; }
        .broadcast-callout {
          left: 14px; right: 14px; top: 16px; max-width: none; padding: 10px 12px; font-size: 16px;
        }
        .scorebug {
          right: 14px;
          bottom: 20px;
          left: 14px;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
          max-width: none;
          min-height: 72px;
        }
        .team { gap: 9px; padding-right: 10px; }
        .team-label { font-size: 8px; }
        .team-name { font-size: 12px; }
        .score { font-size: 25px; }
        .game-state { gap: 9px; padding: 10px; }
        .period-value { font-size: 13px; }
        .clock { min-width: 51px; }
        .clock-value { font-size: 19px; }
        .broadcast-label { top: 16px; right: 16px; }
        .controls { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 18px 14px 0; }
        .transport { gap: 6px; }
        .control-button { width: 34px; height: 34px; }
        .control-button.primary { width: 40px; height: 40px; }
        .timeline-wrap { grid-template-columns: 36px minmax(0, 1fr) 36px; gap: 7px; }
      }
      @media (max-width: 390px) {
        .team { gap: 7px; }
        .team-name { font-size: 11px; }
        .game-state { gap: 7px; padding: 8px; }
        .period-label, .clock-label { font-size: 8px; }
        .clock { min-width: 46px; }
        .controls { gap: 7px; }
        .control-button { width: 31px; height: 31px; }
        .control-button.primary { width: 38px; height: 38px; }
        .timeline-wrap { grid-template-columns: 32px minmax(0, 1fr) 32px; gap: 5px; }
        .timeline-time { font-size: 10px; }
        .speed-select { min-width: 52px; padding-left: 6px; }
      }
    </style>
  </head>
  <body>
    <main class="player">
      <header class="game-heading" aria-label="Game details">
        <h1 class="game-title">Raptors at Lakers</h1>
        <p class="game-details"><time datetime="2026-11-10">November 10, 2026</time> · Tip-off 7:30 PM ET</p>
      </header>
      <section class="broadcast" aria-label="Basketball broadcast">
        <div class="broadcast-screen" aria-hidden="true"></div>
        <div id="broadcastText" class="broadcast-callout" aria-live="polite">Game on</div>
        <div class="broadcast-label">NBA · Broadcast</div>
        <section class="scorebug" aria-label="Game score">
          <div class="team home">
            <span class="team-accent" aria-hidden="true"></span>
            <div class="team-info"><div class="team-label">Los Angeles</div><div class="team-name">Lakers</div></div>
            <div class="score" id="homeScore">0</div>
          </div>
          <div class="team away">
            <span class="team-accent" aria-hidden="true"></span>
            <div class="team-info"><div class="team-label">Toronto</div><div class="team-name">Raptors</div></div>
            <div class="score" id="awayScore">0</div>
          </div>
          <div class="game-state">
            <div class="period"><span class="period-label">Period</span><span class="period-value" id="period">1st</span></div>
            <div class="clock"><span class="clock-label">Game clock</span><span class="clock-value" id="gameClock" aria-live="off">12:00</span></div>
          </div>
        </section>
      </section>

      <div class="controls" role="group" aria-label="Playback controls">
        <div class="transport">
          <button class="control-button" id="restartButton" type="button" aria-label="Restart game" title="Restart game">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L6 7l6 6V9a7 7 0 1 1-6.32 4H3.52A9 9 0 1 0 12 5Z"/></svg>
          </button>
          <button class="control-button primary" id="playButton" type="button" aria-label="Start playback" title="Start playback">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="control-button" id="stepButton" type="button" aria-label="Advance 10 seconds" title="Advance 10 seconds">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14l10-7zm11 0v14l9-7z"/></svg>
          </button>
        </div>
        <div class="timeline-wrap">
          <span class="timeline-time" id="elapsedTime">0:00</span>
          <label class="sr-only" for="timeline">Seek through game</label>
          <input class="timeline" id="timeline" type="range" min="0" max="2880" step="1" value="0" aria-valuetext="0 minutes elapsed" />
          <span class="timeline-time">48:00</span>
        </div>
        <label class="sr-only" for="speedSelect">Playback speed</label>
        <select class="speed-select" id="speedSelect" aria-label="Playback speed">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
        <span class="sr-only" id="playbackStatus" aria-live="polite">Paused</span>
      </div>
    </main>

    <script>
      const QUARTER_SECONDS = 12 * 60;
      const OVERTIME_SECONDS = 5 * 60;
      const GAME_SECONDS = QUARTER_SECONDS * 4;
      const EVENT_MATCH_TOLERANCE = 0.45;
      const EVENT_DISPLAY_MS = 2600;
      const BAD_EVENTS = [];

      const clockEl = document.getElementById('gameClock');
      const periodEl = document.getElementById('period');
      const playButton = document.getElementById('playButton');
      const restartButton = document.getElementById('restartButton');
      const stepButton = document.getElementById('stepButton');
      const timeline = document.getElementById('timeline');
      const elapsedEl = document.getElementById('elapsedTime');
      const speedSelect = document.getElementById('speedSelect');
      const playbackStatus = document.getElementById('playbackStatus');
      const broadcastTextEl = document.getElementById('broadcastText');
      const homeScoreEl = document.getElementById('homeScore');
      const awayScoreEl = document.getElementById('awayScore');

      let elapsed = 0;
      let isPlaying = false;
      let lastTick = 0;
      let timerId = null;
      let playList = [];
      let currentEventSequence = [];
      let eventQueueTimer = null;
      let hasLoadedGame = false;
      let resumePlaybackAfterQueue = false;

      function formatClock(seconds) {
        const wholeSeconds = Math.max(0, Math.ceil(seconds));
        return `${Math.floor(wholeSeconds / 60)}:${String(wholeSeconds % 60).padStart(2, '0')}`;
      }

      function ordinalPeriod(period) {
        if (period >= 5) return `${period}th`;
        return ['1st', '2nd', '3rd', '4th'][period] || '4th';
      }

      function parseNumber(value) {
        if (value === null || value === undefined) return null;
        if (typeof value === 'number' && Number.isFinite(value)) return value;
        if (typeof value === 'string') {
          const trimmed = value.trim();
          if (!trimmed) return null;
          const normalized = trimmed.replace(/[^0-9.-]/g, '');
          if (!normalized) return null;
          const parsed = Number(normalized);
          return Number.isFinite(parsed) ? parsed : null;
        }
        if (typeof value === 'object') {
          return parseNumber(value.value ?? value.displayValue ?? value.amount ?? value.score ?? value.number);
        }
        return null;
      }

      function normalizeText(value, fallback = 'Play') {
        if (value === null || value === undefined || value === '') return fallback;
        if (typeof value === 'string') return value.trim() || fallback;
        if (typeof value === 'object') {
          const pick = value.text ?? value.description ?? value.displayValue ?? value.shortText ?? value.value;
          return normalizeText(pick, fallback);
        }
        return String(value);
      }

      function parseClockToSeconds(rawClock) {
        if (rawClock === null || rawClock === undefined || rawClock === '') return 0;
        if (typeof rawClock === 'number') return rawClock;
        if (typeof rawClock === 'string') {
          const text = rawClock.trim();
          if (!text) return 0;
          const match = text.match(/(\d+):(\d{1,2})/);
          if (match) {
            return Number(match[1]) * 60 + Number(match[2]);
          }
          const plain = Number(text.replace(/[^0-9.]/g, ''));
          if (Number.isFinite(plain)) return plain;
        }
        if (typeof rawClock === 'object') {
          return parseClockToSeconds(rawClock.value ?? rawClock.displayValue ?? rawClock.text ?? rawClock.clock);
        }
        return 0;
      }

      function parsePeriodValue(rawPeriod) {
        if (rawPeriod === null || rawPeriod === undefined) return 1;
        if (typeof rawPeriod === 'number') return rawPeriod;
        if (typeof rawPeriod === 'string') {
          const clean = rawPeriod.trim().toLowerCase();
          if (clean.includes('ot')) {
            const number = Number(clean.replace(/[^0-9]/g, '')) || 1;
            return 4 + number;
          }
          const match = clean.match(/(\d+)/);
          if (match) return Number(match[1]);
          if (clean === '1st') return 1;
          if (clean === '2nd') return 2;
          if (clean === '3rd') return 3;
          if (clean === '4th') return 4;
        }
        if (typeof rawPeriod === 'object') {
          return parsePeriodValue(rawPeriod.value ?? rawPeriod.displayValue ?? rawPeriod.number ?? rawPeriod.label);
        }
        return 1;
      }

      function getEventScore(play) {
        if (!play || typeof play !== 'object') {
          return { home: 0, away: 0 };
        }

        const homeValue = parseNumber(
          play.homeScore ??
          play.home_score ??
          play.home?.score ??
          play.home?.value ??
          play.score?.home ??
          play.scoreValue?.home ??
          play.teamScores?.home ??
          play.scoreboard?.home ??
          play.points?.home
        );

        const awayValue = parseNumber(
          play.awayScore ??
          play.away_score ??
          play.away?.score ??
          play.away?.value ??
          play.score?.away ??
          play.scoreValue?.away ??
          play.teamScores?.away ??
          play.scoreboard?.away ??
          play.points?.away
        );

        if (homeValue !== null || awayValue !== null) {
          return {
            home: homeValue ?? 0,
            away: awayValue ?? 0,
          };
        }

        const summary = normalizeText(play.summary ?? play.text ?? play.description ?? play.detail ?? '', '');
        const scoreMatch = summary.match(/(\d+)\s*-\s*(\d+)/);
        if (scoreMatch) {
          return {
            home: Number(scoreMatch[1]),
            away: Number(scoreMatch[2]),
          };
        }

        return { home: 0, away: 0 };
      }

      function normalizePlay(rawPlay, index) {
        const play = rawPlay || {};
        const period = parsePeriodValue(play.period ?? play.quarter ?? play.periodNumber ?? play.periodValue ?? play.periodName ?? play.displayPeriod);
        const remainingClock = parseClockToSeconds(play.clock ?? play.gameClock ?? play.clockText ?? play.time ?? play.displayClock ?? play.remainingTime ?? play.game_clock);
        const periodStartSeconds = (period - 1) * QUARTER_SECONDS + (period > 4 ? (period - 4) * OVERTIME_SECONDS : 0);
        const absoluteSeconds = periodStartSeconds + (QUARTER_SECONDS - remainingClock);

        const text = normalizeText(play.text ?? play.description ?? play.desc ?? play.playText ?? play.summary ?? play.detail ?? play.message ?? `Play ${index + 1}`);
        const score = getEventScore(play);

        return {
          index,
          original: play,
          period,
          clock: remainingClock,
          text,
          absoluteSeconds,
          score,
        };
      }

      function setBroadcastText(message) {
        if (!message) {
          broadcastTextEl.classList.remove('visible');
          broadcastTextEl.textContent = 'Game on';
          return;
        }

        broadcastTextEl.textContent = message;
        broadcastTextEl.classList.add('visible');
      }

      function updateScoreHomeAway(score) {
        const homeValue = Number.isFinite(score.home) ? score.home : 0;
        const awayValue = Number.isFinite(score.away) ? score.away : 0;
        homeScoreEl.textContent = String(homeValue);
        awayScoreEl.textContent = String(awayValue);
      }

      function getScoreAtTime(targetSeconds) {
        let currentScore = { home: 0, away: 0 };
        if (!playList.length) return currentScore;

        for (const play of playList) {
          if (play.absoluteSeconds <= targetSeconds + EVENT_MATCH_TOLERANCE) {
            currentScore = play.score;
          }
        }

        return currentScore;
      }

      function applyScoreToCurrentTime() {
        const currentScore = getScoreAtTime(elapsed);
        updateScoreHomeAway(currentScore);
      }

      function clearEventQueue() {
        if (eventQueueTimer !== null) {
          window.clearTimeout(eventQueueTimer);
          eventQueueTimer = null;
        }
        currentEventSequence = [];
      }

      function showEventSequence(events) {
        if (!events || !events.length) return;

        clearEventQueue();
        currentEventSequence = [...events];
        resumePlaybackAfterQueue = isPlaying;

        if (resumePlaybackAfterQueue) {
          setPlaying(false);
        }

        const nextEvent = currentEventSequence.shift();
        if (nextEvent) {
          setBroadcastText(nextEvent.text);
          updateScoreHomeAway(nextEvent.score);
        }

        if (currentEventSequence.length) {
          eventQueueTimer = window.setTimeout(() => {
            const event = currentEventSequence.shift();
            if (event) {
              setBroadcastText(event.text);
              updateScoreHomeAway(event.score);
            }
            if (currentEventSequence.length) {
              eventQueueTimer = window.setTimeout(() => {
                const lateEvent = currentEventSequence.shift();
                if (lateEvent) {
                  setBroadcastText(lateEvent.text);
                  updateScoreHomeAway(lateEvent.score);
                }
                if (currentEventSequence.length) {
                  do { /* keep processing sequentially */ }
                  while (false);
                }
                finaliseEventSequence();
              }, EVENT_DISPLAY_MS);
            } else {
              finaliseEventSequence();
            }
          }, EVENT_DISPLAY_MS);
        } else {
          finaliseEventSequence();
        }
      }

      function finaliseEventSequence() {
        currentEventSequence = [];
        eventQueueTimer = null;
        const resume = resumePlaybackAfterQueue;
        resumePlaybackAfterQueue = false;
        if (resume) {
          setPlaying(true);
        }
      }

      function triggerEventDisplayAtCurrentTime() {
        const tolerance = EVENT_MATCH_TOLERANCE;
        const activeEvents = playList.filter((play) => {
          return Math.abs(play.absoluteSeconds - elapsed) <= tolerance;
        });

        if (!activeEvents.length) return;

        const unique = activeEvents.filter((play, i, arr) => arr.findIndex((entry) => entry.text === play.text && entry.absoluteSeconds === play.absoluteSeconds) === i);
        if (!unique.length) return;

        showEventSequence(unique);
      }

      function handleTimeSeek(value) {
        clearEventQueue();
        elapsed = Number(value);
        applyScoreToCurrentTime();

        const matchedEvent = playList.find((play) => {
          return Math.abs(play.absoluteSeconds - elapsed) <= EVENT_MATCH_TOLERANCE;
        });

        if (matchedEvent) {
          setBroadcastText(matchedEvent.text);
        } else {
          setBroadcastText('');
        }

        render();
      }

      function render() {
        elapsed = Math.min(GAME_SECONDS, Math.max(0, elapsed));
        const finished = elapsed >= GAME_SECONDS;
        const periodIndex = finished ? 3 : Math.floor(elapsed / QUARTER_SECONDS);
        const secondsIntoPeriod = finished ? QUARTER_SECONDS : elapsed % QUARTER_SECONDS;
        const remaining = finished ? 0 : QUARTER_SECONDS - secondsIntoPeriod;
        const seekPosition = Math.floor(elapsed);

        clockEl.textContent = formatClock(remaining);
        periodEl.textContent = ordinalPeriod(periodIndex);
        timeline.value = String(seekPosition);
        elapsedEl.textContent = formatClock(seekPosition);
        timeline.style.setProperty('--progress', `${(elapsed / GAME_SECONDS) * 100}%`);
        timeline.setAttribute('aria-valuetext', `${Math.floor(elapsed / 60)} minutes ${Math.floor(elapsed % 60)} seconds elapsed`);

        if (finished) {
          setPlaying(false);
          playbackStatus.textContent = 'Game ended';
        }
      }

      function setPlaying(playing) {
        isPlaying = playing && elapsed < GAME_SECONDS;
        playButton.classList.toggle('is-playing', isPlaying);
        playButton.setAttribute('aria-label', isPlaying ? 'Pause playback' : 'Start playback');
        playButton.title = isPlaying ? 'Pause playback' : 'Start playback';
        playbackStatus.textContent = isPlaying ? 'Playing' : 'Paused';
        if (timerId !== null) {
          window.clearInterval(timerId);
          timerId = null;
        }
        if (isPlaying) {
          lastTick = performance.now();
          timerId = window.setInterval(() => {
            const now = performance.now();
            elapsed += ((now - lastTick) / 1000) * Number(speedSelect.value);
            lastTick = now;
            triggerEventDisplayAtCurrentTime();
            applyScoreToCurrentTime();
            render();
          }, 100);
        }
      }

      function loadPlayData() {
        fetch('data/raw/espn/401909906.json?t=' + Date.now())
          .then((response) => {
            if (!response.ok) {
              throw new Error('Unable to load game data');
            }
            return response.json();
          })
          .then((payload) => {
            const rawPlays = Array.isArray(payload.plays) ? payload.plays : [];
            const normalized = rawPlays.map((entry, index) => {
              try {
                return normalizePlay(entry, index);
              } catch (error) {
                BAD_EVENTS.push({ index, error: String(error), entry });
                console.warn('Bad play event', { index, entry, error });
                return null;
              }
            }).filter(Boolean);

            if (!normalized.length) {
              console.warn('No valid plays found in payload');
              setBroadcastText('No plays available');
              return;
            }

            playList = normalized.sort((a, b) => a.absoluteSeconds - b.absoluteSeconds);
            hasLoadedGame = true;
            applyScoreToCurrentTime();
            render();
          })
          .catch((error) => {
            console.error(error);
            setBroadcastText('Game data unavailable');
          });
      }

      playButton.addEventListener('click', () => setPlaying(!isPlaying));
      restartButton.addEventListener('click', () => {
        clearEventQueue();
        setPlaying(false);
        elapsed = 0;
        setBroadcastText('');
        applyScoreToCurrentTime();
        render();
      });
      stepButton.addEventListener('click', () => {
        clearEventQueue();
        setPlaying(false);
        elapsed = Math.min(GAME_SECONDS, elapsed + 10);
        applyScoreToCurrentTime();
        render();
      });
      timeline.addEventListener('input', () => {
        if (hasLoadedGame) {
          handleTimeSeek(Number(timeline.value));
        }
      });
      speedSelect.addEventListener('change', () => {
        if (isPlaying) lastTick = performance.now();
      });

      render();
      loadPlayData();
    </script>
  </body>
</html>
