<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <title>Raptors Play-by-Play</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f5f5f6;
        background: #101114;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(560px, 100%); }
      h1 { margin: 0; font-size: clamp(24px, 5vw, 36px); letter-spacing: -.05em; }
      .muted { color: #a4a5aa; }
      .selection { margin-top: 24px; padding: 20px; border: 1px solid #303136; border-radius: 12px; background: #191a1e; }
      .selection p { margin: 8px 0 0; }
      button, input { font: inherit; }
      button { color: inherit; cursor: pointer; }
      .open-dialog { margin-top: 22px; padding: 10px 14px; border: 1px solid #48494f; border-radius: 7px; background: transparent; }
      .open-dialog:hover, .game-option:hover { background: #25262b; }
      dialog { width: min(440px, calc(100% - 32px)); max-height: min(620px, calc(100% - 32px)); padding: 0; color: #f5f5f6; background: #191a1e; border: 1px solid #36373d; border-radius: 12px; }
      dialog::backdrop { background: rgb(0 0 0 / 76%); }
      .dialog-content { padding: 22px; }
      .dialog-title { margin: 0 0 16px; font-size: 19px; letter-spacing: -.03em; }
      .search { width: 100%; padding: 11px 12px; color: inherit; background: #101114; border: 1px solid #3a3b41; border-radius: 7px; }
      .search:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      .game-list { display: grid; gap: 3px; max-height: min(52vh, 390px); margin-top: 12px; overflow-y: auto; }
      .game-option { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%; padding: 12px 10px; text-align: left; background: transparent; border: 0; border-radius: 6px; }
      .game-name { font-size: 14px; font-weight: 550; }
      .game-date { flex: 0 0 auto; color: #a4a5aa; font-size: 12px; }
      .message { padding: 16px 10px; color: #a4a5aa; font-size: 14px; }
      @media (max-width: 420px) { body { padding: 16px; } .dialog-content { padding: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Toronto Raptors</h1>
      <section class="selection" aria-live="polite">
        <p id="selectedGame" class="muted">Choose a game to get started.</p>
        <button id="changeGame" class="open-dialog" type="button" hidden>Choose another game</button>
      </section>
    </main>

    <dialog id="gameDialog" aria-labelledby="dialogTitle">
      <div class="dialog-content">
        <h2 class="dialog-title" id="dialogTitle">Choose a game</h2>
        <label class="sr-only" for="gameSearch">Search games or teams</label>
        <input class="search" id="gameSearch" type="search" placeholder="Search games or teams" autocomplete="off" />
        <div class="game-list" id="gameList" role="listbox" aria-label="Available Raptors games" aria-live="polite">
          <div class="message">Loading games…</div>
        </div>
      </div>
    </dialog>

    <script>
      const INDEX_URL = "data/index.json";
      const dialog = document.getElementById("gameDialog");
      const search = document.getElementById("gameSearch");
      const list = document.getElementById("gameList");
      const selectedGame = document.getElementById("selectedGame");
      const changeGame = document.getElementById("changeGame");
      let games = [];

      function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }).format(date);
      }

      function renderGames(query = "") {
        const term = query.trim().toLowerCase();
        const matches = games.filter(game =>
          [game.name, game.short_name, game.game_id, formatDate(game.date)]
            .filter(Boolean).join(" ").toLowerCase().includes(term)
        );
        list.replaceChildren();
        if (!matches.length) {
          const empty = document.createElement("div");
          empty.className = "message";
          empty.textContent = games.length ? "No games found." : "No games available.";
          list.append(empty);
          return;
        }
        for (const game of matches) {
          const option = document.createElement("button");
          option.type = "button";
          option.className = "game-option";
          option.setAttribute("role", "option");
          const name = document.createElement("span");
          name.className = "game-name";
          name.textContent = game.name || game.short_name || game.game_id || "Raptors game";
          const date = document.createElement("span");
          date.className = "game-date";
          date.textContent = formatDate(game.date);
          option.append(name, date);
          option.addEventListener("click", () => {
            selectedGame.textContent = game.name || game.short_name || game.game_id || "Raptors game";
            changeGame.hidden = false;
            dialog.close();
          });
          list.append(option);
        }
      }

      async function loadGames() {
        try {
          const response = await fetch(`${INDEX_URL}?t=${Date.now()}`);
          if (!response.ok) throw new Error(`Request failed (${response.status}).`);
          const data = await response.json();
          games = Array.isArray(data.games) ? data.games : [];
          renderGames(search.value);
        } catch (error) {
          list.replaceChildren();
          const message = document.createElement("div");
          message.className = "message";
          message.textContent = `Could not load games: ${error.message}`;
          list.append(message);
        }
      }

      search.addEventListener("input", () => renderGames(search.value));
      changeGame.addEventListener("click", () => {
        renderGames(search.value);
        dialog.showModal();
        search.focus();
      });
      search.addEventListener("keydown", event => {
        if (event.key === "Escape") event.preventDefault();
      });

      dialog.showModal();
      loadGames().then(() => search.focus());
    </script>
  </body>
</html>
