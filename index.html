<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Raptors schedule</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0f13;--line:rgba(255,255,255,.1);--text:#f4f5f7;--muted:#a2a7b1;--accent:#ce1141;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:32px 18px;display:grid;place-items:center;background:var(--bg);color:var(--text)}main{width:min(760px,100%)}
    .topbar{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:8px}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}h1{margin:4px 0 0;font-size:clamp(26px,4vw,42px);line-height:1;font-weight:650;letter-spacing:-.06em}
    .controls{display:flex;align-items:center;gap:8px}button,input{font:inherit}button{cursor:pointer}.icon-button{width:36px;height:36px;display:grid;place-items:center;padding:0;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px}.icon-button:hover{background:#ffffff08}.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .calendar-wrap{position:relative;width:36px;height:36px}.date-input{position:absolute;inset:0;width:36px;height:36px;opacity:0;cursor:pointer}.search-field{width:min(220px,38vw);padding:9px 12px;color:var(--text);background:#ffffff04;border:1px solid var(--line);border-radius:8px}.search-field::placeholder{color:var(--muted)}[hidden]{display:none!important}
    .status{min-height:18px;margin:9px 0 12px;color:var(--muted);font-size:12px}.status.error{color:#ffb4c6}.legend,.game-row{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:16px}.legend{padding:10px 12px 8px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.away{text-align:left}.home{text-align:right}.center{text-align:center}.list{border-top:1px solid var(--line)}
    .game-row{align-items:center;width:100%;min-height:64px;padding:14px 12px;color:var(--text);text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line)}.game-row:hover{background:#ffffff05}.game-row[aria-pressed="true"]{background:#ce11410d;box-shadow:inset 3px 0 var(--accent)}.team{min-width:0;overflow:hidden;font-size:15px;font-weight:550;white-space:nowrap;text-overflow:ellipsis}.game-date{text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.game-date strong{display:block;color:var(--text);font-size:13px;font-weight:600}.message{padding:20px 12px;color:var(--muted);font-size:14px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
    @media(max-width:560px){body{padding:24px 14px}.topbar{align-items:center;flex-wrap:wrap}.legend,.game-row{grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr);gap:10px}.search-field{width:150px}}@media(max-width:420px){.team{font-size:13px}.legend,.game-row{grid-template-columns:minmax(0,1fr) 88px minmax(0,1fr);gap:7px}.search-field{width:125px}}
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div><div class="eyebrow">Toronto Raptors</div><h1 id="selectedDateTitle">Loading…</h1></div>
      <div class="controls">
        <div class="calendar-wrap">
          <button class="icon-button" id="calendarButton" type="button" aria-label="Choose date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></button>
          <input class="date-input" id="dayPicker" type="date" aria-label="Choose a game date">
        </div>
        <button class="icon-button" id="searchToggle" type="button" aria-label="Search games" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg></button>
        <label class="sr-only" for="gameSearch">Search games</label><input id="gameSearch" class="search-field" type="search" placeholder="Search games" autocomplete="off" hidden>
      </div>
    </header>
    <div id="status" class="status" role="status" aria-live="polite">Loading schedule…</div>
    <div class="legend" aria-hidden="true"><span class="away">Away</span><span class="center">Date</span><span class="home">Home</span></div>
    <section id="gameList" class="list" aria-label="Raptors schedule" aria-live="polite"><div class="message">Loading schedule…</div></section>
  </main>
  <script>
    const ESPN_URL="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/tor/schedule";
    const INDEX_URL="data/index.json";
    const $=id=>document.getElementById(id);
    const list=$("gameList"),status=$("status"),search=$("gameSearch"),searchToggle=$("searchToggle"),dayPicker=$("dayPicker"),title=$("selectedDateTitle");
    let games=[],localGames=new Map(),selectedDate="",selectedId="";

    function dateKey(value){if(!value)return"";const d=new Date(value);return Number.isNaN(d.getTime())?"":d.toISOString().slice(0,10)}
    function dateLabel(value,options){const d=new Date(`${value}T12:00:00Z`);return Number.isNaN(d.getTime())?"Select a date":new Intl.DateTimeFormat(undefined,{...options,timeZone:"UTC"}).format(d)}
    function titleDate(value){title.textContent=value?dateLabel(value,{month:"long",day:"numeric",year:"numeric"}):"No games"}
    function teamName(game,side){const c=(game.competitors||[]).find(x=>String(x.homeAway).toLowerCase()===side);return c?.team?.shortDisplayName||c?.team?.displayName||c?.team?.abbreviation||(side==="home"?"Home":"Away")}
    function setStatus(message,error=false){status.textContent=message;status.classList.toggle("error",error)}
    function chooseDefaultDate(){const today=new Date().toISOString().slice(0,10);const dates=[...new Set(games.map(g=>dateKey(g.date)).filter(Boolean))].sort();return dates.includes(today)?today:dates.filter(d=>d<=today).at(-1)||dates[0]||""}

    function render(){
      const query=search.value.trim().toLowerCase();
      const matches=games.filter(g=>dateKey(g.date)===selectedDate&&(!query||`${g.name} ${g.shortName} ${teamName(g,"away")} ${teamName(g,"home")}`.toLowerCase().includes(query)));
      list.replaceChildren();
      if(!matches.length){const empty=document.createElement("div");empty.className="message";empty.textContent="No games scheduled for this date.";list.append(empty);return}
      for(const game of matches){
        const row=document.createElement("button");row.type="button";row.className="game-row";row.setAttribute("aria-pressed",String(game.id===selectedId));
        const away=document.createElement("span");away.className="team away";away.textContent=teamName(game,"away");
        const date=document.createElement("span");date.className="game-date";const strong=document.createElement("strong");strong.textContent=dateLabel(dateKey(game.date),{month:"short",day:"numeric"});date.append(strong,document.createTextNode("Game"));
        const home=document.createElement("span");home.className="team home";home.textContent=teamName(game,"home");row.append(away,date,home);
        row.addEventListener("click",()=>selectGame(game));list.append(row);
      }
    }

    function selectGame(game){
      selectedId=game.id;
      if(!localGames.has(game.id)){
        setStatus("Game data not found for this matchup.",true);
      }else{
        setStatus("Game data is available.");
      }
      render();
    }
    function setDate(value){selectedDate=value;dayPicker.value=value;titleDate(value);selectedId="";setStatus("");render()}

    searchToggle.addEventListener("click",()=>{const show=search.hidden;search.hidden=!show;searchToggle.setAttribute("aria-expanded",String(show));if(show)search.focus();else{search.value="";render()}});
    search.addEventListener("input",render);
    dayPicker.addEventListener("change",()=>setDate(dayPicker.value));
    $("calendarButton").addEventListener("click",()=>{if(dayPicker.showPicker)dayPicker.showPicker();else dayPicker.click()});

    async function loadLocalIndex(){try{const r=await fetch(`${INDEX_URL}?t=${Date.now()}`);if(!r.ok)return;const data=await r.json();for(const game of Array.isArray(data.games)?data.games:[]){const id=String(game.game_id||game.id||"");if(id)localGames.set(id,game)}}catch(_){/* Local data is checked on selection; schedule remains ESPN sourced. */}}
    async function loadSchedule(){
      try{
        const [,response]=await Promise.all([loadLocalIndex(),fetch(ESPN_URL)]);
        if(!response.ok)throw new Error(`ESPN request failed (${response.status}).`);
        const data=await response.json();const events=Array.isArray(data.events)?data.events:[];
        games=events.map(event=>{const competition=(event.competitions||[])[0]||{};return{id:String(event.id||competition.id||""),name:event.name||"",shortName:event.shortName||"",date:event.date||competition.date||"",competitors:competition.competitors||[]}}).filter(g=>g.id&&g.date).sort((a,b)=>b.date.localeCompare(a.date));
        if(!games.length)throw new Error("ESPN returned no scheduled games.");
        setDate(chooseDefaultDate());setStatus("Schedule from ESPN. Select a game to check for play-by-play data.");
      }catch(error){list.replaceChildren();const message=document.createElement("div");message.className="message";message.textContent=`Could not load ESPN schedule: ${error.message}`;list.append(message);title.textContent="Schedule unavailable";setStatus("Check your connection and try again.",true)}
    }
    loadSchedule();
  </script>
</body>
</html>
