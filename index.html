<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <title>Raptors Games</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f5f5f6;
        background: #101114;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 32px 20px; }
      main { width: min(720px, 100%); margin: 0 auto; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -.045em; }
      .tools { display: flex; align-items: center; gap: 8px; }
      button, input { color: inherit; font: inherit; }
      button { cursor: pointer; }
      .icon-button { display: grid; width: 38px; height: 38px; place-items: center; padding: 0; background: transparent; border: 1px solid #34353a; border-radius: 8px; }
      .icon-button:hover, .game-row:hover { background: #1c1d21; }
      .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
      .date-picker { width: 42px; height: 38px; padding: 0 4px; color: transparent; background: transparent; border: 1px solid #34353a; border-radius: 8px; cursor: pointer; }
      .date-picker::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(1); }
      .search-wrap { display: flex; align-items: center; gap: 8px; }
      .search { width: min(240px, 42vw); padding: 9px 11px; color: inherit; background: #17181c; border: 1px solid #34353a; border-radius: 8px; }
      [hidden] { display: none !important; }
      .list { border-top: 1px solid #303136; }
      .game-row { display: grid; grid-template-columns: minmax(0, 1fr) 112px minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; min-height: 76px; padding: 14px 12px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid #303136; border-radius: 0; }
      .game-row[aria-pressed="true"] { background: #1c1d21; box-shadow: inset 3px 0 #ce1141; }
      .team { min-width: 0; font-size: 15px; font-weight: 560; }
      .team-away { text-align: right; }
      .team-home { text-align: left; }
      .game-date { color: #a4a5aa; text-align: center; font-size: 12px; line-height: 1.5; font-variant-numeric: tabular-nums; }
      .game-date small { display: block; color: #777980; font-size: 10px; }
      .message { padding: 24px 12px; color: #a4a5aa; font-size: 14px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      @media (max-width: 480px) {
        body { padding: 22px 14px; }
        h1 { font-size: 21px; }
        .game-row { grid-template-columns: minmax(0, 1fr) 82px minmax(0, 1fr); gap: 6px; min-height: 68px; padding: 12px 8px; }
        .team { font-size: 13px; }
        .game-date { font-size: 11px; }
        .search { width: min(180px, 43vw); }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <h1>Raptors games</h1>
        <div class="tools">
          <div class="search-wrap">
            <label class="sr-only" for="gameSearch">Search games and teams</label>
            <input id="gameSearch" class="search" type="search" placeholder="Search games" autocomplete="off" hidden />
            <button id="searchToggle" class="icon-button" type="button" aria-label="Search games" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m16 16 4.2 4.2"></path></svg>
            </button>
          </div>
          <label class="sr-only" for="dayPicker">Show games on a different day</label>
          <input id="dayPicker" class="date-picker" type="date" aria-label="Choose a game date" title="Choose a game date" />
        </div>
      </header>
      <section id="gameList" class="list" aria-label="Available games" aria-live="polite">
        <div class="message">Loading games…</div>
      </section>
    </main>

    <script>
      const INDEX_URL = "data/index.json";
      const list = document.getElementById("gameList");
      const search = document.getElementById("gameSearch");
      const searchToggle = document.getElementById("searchToggle");
      const dayPicker = document.getElementById("dayPicker");
      let games = [];
      let selectedId = null;

      function dayKey(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : date.toISOString().slice(0, 10);
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return { date: "Date unavailable", day: "" };
        return {
          date: new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", timeZone: "UTC" }).format(date),
          day: new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" }).format(date)
        };
      }

      function teamName(game, homeAway) {
        const competitor = (game.competitors || []).find(team => team.homeAway === homeAway);
        return competitor?.team?.shortDisplayName || competitor?.team?.displayName || competitor?.team?.abbreviation || (homeAway === "away" ? "Away" : "Home");
      }

      function render() {
        const query = search.value.trim().toLowerCase();
        const day = dayPicker.value;
        const matches = games.filter(game => {
          const teams = `${game.name || ""} ${game.short_name || ""} ${teamName(game, "away")} ${teamName(game, "home")}`.toLowerCase();
          return (!day || dayKey(game.date) === day) && (!query || teams.includes(query));
        });
        list.replaceChildren();
        if (!matches.length) {
          const empty = document.createElement("div");
          empty.className = "message";
          empty.textContent = games.length ? "No games found for this day." : "No games available.";
          list.append(empty);
          return;
        }
        for (const game of matches) {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "game-row";
          row.setAttribute("role", "listitem");
          row.setAttribute("aria-pressed", String(game.game_id === selectedId));
          row.setAttribute("aria-label", `${teamName(game, "away")} at ${teamName(game, "home")}, ${formatDate(game.date).date}`);
          const away = document.createElement("span");
          away.className = "team team-away";
          away.textContent = teamName(game, "away");
          const date = document.createElement("span");
          date.className = "game-date";
          const formatted = formatDate(game.date);
          date.append(document.createTextNode(formatted.date));
          const weekday = document.createElement("small");
          weekday.textContent = formatted.day;
          date.append(weekday);
          const home = document.createElement("span");
          home.className = "team team-home";
          home.textContent = teamName(game, "home");
          row.append(away, date, home);
          row.addEventListener("click", () => {
            selectedId = game.game_id;
            render();
          });
          list.append(row);
        }
      }

      searchToggle.addEventListener("click", () => {
        const opening = search.hidden;
        search.hidden = !opening;
        searchToggle.setAttribute("aria-expanded", String(opening));
        if (opening) search.focus();
        else { search.value = ""; render(); }
      });
      search.addEventListener("input", render);
      dayPicker.addEventListener("change", render);

      async function loadGames() {
        try {
          const response = await fetch(`${INDEX_URL}?t=${Date.now()}`);
          if (!response.ok) throw new Error(`Request failed (${response.status}).`);
          const data = await response.json();
          games = Array.isArray(data.games) ? data.games.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")) : [];
          render();
        } catch (error) {
          list.replaceChildren();
          const message = document.createElement("div");
          message.className = "message";
          message.textContent = `Could not load games: ${error.message}`;
          list.append(message);
        }
      }
      loadGames();
    </script>
  </body>
</html>
