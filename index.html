

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Raptors Play-by-Play</title>

<style>

body {

  font-family: -apple-system, BlinkMacSystemFont, sans-serif;

  margin: 0;

  padding: 16px;

  background: #f3f4f6;

  color: #171717;

}

h1 { margin-top: 4px; }

select {

  width: 100%;

  padding: 14px;

  font-size: 16px;

  border-radius: 10px;

  border: 1px solid #ccc;

  background: white;

}

#status { color: #666; margin: 12px 0; }

.play {

  background: white;

  padding: 12px;

  margin: 8px 0;

  border-radius: 10px;

  border-left: 4px solid #ce1141;

}

.time { color: #777; font-size: 13px; }

.desc { margin-top: 5px; font-weight: 500; }

.score { font-weight: bold; margin-top: 5px; }

</style>

</head>

<body>

<h1>Toronto Raptors</h1>

<p>Last 5 games · Play-by-play</p>

<select id="games">

<option>Loading games...</option>

</select>

<div id="status">Loading data...</div>

<div id="plays"></div>

<script>

const DATA_URL = "data/index.json";

async function loadData() {

  const status = document.getElementById("status");

  try {

    const response = await fetch(DATA_URL + "?t=" + Date.now());

    if (!response.ok) throw new Error("Could not load JSON");

    const data = await response.json();

    const games = data.games || data;

    const selector = document.getElementById("games");

    selector.innerHTML = "";

    games.forEach((game, i) => {

      const option = document.createElement("option");

      option.value = i;

      option.textContent =

        game.gameId || game.game_id || game.gameCode || `Game ${i+1}`;

      selector.appendChild(option);

    });

    selector.onchange = () => showGame(games[selector.value]);

    showGame(games[0]);

  } catch (error) {

    status.textContent = "Error: " + error.message;

  }

}

function showGame(game) {

  const container = document.getElementById("plays");

  const status = document.getElementById("status");

  container.innerHTML = "";

  const plays = game.plays || game.playByPlay ||

                game.play_by_play || game.actions || [];

  status.textContent = plays.length

    ? plays.length + " plays"

    : "Game loaded. No plays found. JSON structure may need adjustment.";

  plays.forEach(play => {

    const div = document.createElement("div");

    div.className = "play";

    const period = play.period || play.quarter || "";

    const clock = play.clock || play.gameClock || play.time || "";

    const description = play.description ||

      play.desc || play.actionDescription || play.text || "Play";

    div.innerHTML = `

      <div class="time">Q${period} · ${clock}</div>

      <div class="desc"></div>

    `;

    div.querySelector(".desc").textContent = description;

    container.appendChild(div);

  });

}

loadData();

</script>

</body>

</html>
