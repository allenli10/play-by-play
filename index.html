<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <title>Raptors Play-by-Play</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101114;
        --surface: #1b1c20;
        --surface-raised: #24252a;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f5f5f6;
        --muted: #a4a5aa;
        --raptors: #ce1141;
        --away: #4b78d1;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(16px, 4vw, 48px);
        display: grid;
        place-items: center;
        background: #08090b;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .broadcast {
        position: relative;
        width: min(1440px, 100%);
        aspect-ratio: 16 / 9;
        min-height: 300px;
        overflow: hidden;
        background: var(--background);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
      }

      /* Intentionally empty: this first pass is only the broadcast HUD. */
      .broadcast-screen {
        position: absolute;
        inset: 0;
        background: #101114;
      }

      .scorebug {
        position: absolute;
        left: clamp(18px, 4vw, 56px);
        bottom: clamp(18px, 4vw, 52px);
        display: grid;
        grid-template-columns: minmax(155px, 1fr) minmax(155px, 1fr) auto;
        align-items: stretch;
        max-width: calc(100% - 36px);
        min-height: 82px;
        overflow: hidden;
        background: rgba(25, 26, 30, 0.97);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
      }

      .team {
        display: grid;
        grid-template-columns: 4px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        min-width: 0;
        padding: 14px 18px 14px 0;
      }

      .team + .team { border-left: 1px solid var(--line); }

      .team-accent { align-self: stretch; background: var(--raptors); }
      .team.away .team-accent { background: var(--away); }

      .team-info { min-width: 0; }

      .team-label {
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1.2;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .team-name {
        margin-top: 5px;
        overflow: hidden;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .score {
        padding-left: 6px;
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .game-state {
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        background: var(--surface-raised);
        border-left: 1px solid var(--line);
      }

      .period {
        display: grid;
        gap: 4px;
        text-align: center;
      }

      .period-label,
      .clock-label {
        color: var(--muted);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .period-value {
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }

      .clock {
        display: grid;
        gap: 4px;
        min-width: 65px;
        text-align: center;
      }

      .clock-value {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .shot-clock {
        position: absolute;
        left: clamp(18px, 4vw, 56px);
        bottom: calc(clamp(18px, 4vw, 52px) + 96px);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        color: var(--muted);
        background: rgba(25, 26, 30, 0.94);
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .shot-clock strong {
        color: var(--text);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .broadcast-label {
        position: absolute;
        top: 20px;
        right: 22px;
        color: rgba(255, 255, 255, 0.36);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      @media (max-width: 620px) {
        body { padding: 0; place-items: stretch; }
        .broadcast {
          width: 100%;
          min-height: 100svh;
          aspect-ratio: auto;
          border: 0;
          border-radius: 0;
        }
        .scorebug {
          right: 14px;
          bottom: 20px;
          left: 14px;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
          max-width: none;
          min-height: 72px;
        }
        .team { gap: 9px; padding-right: 10px; }
        .team-label { font-size: 8px; }
        .team-name { font-size: 12px; }
        .score { font-size: 25px; }
        .game-state { gap: 9px; padding: 10px; }
        .period-value { font-size: 13px; }
        .clock { min-width: 51px; }
        .clock-value { font-size: 19px; }
        .shot-clock { bottom: 104px; left: 14px; }
        .broadcast-label { top: 16px; right: 16px; }
      }

      @media (max-width: 390px) {
        .scorebug { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
        .team { gap: 7px; }
        .team-name { font-size: 11px; }
        .game-state { gap: 7px; padding: 8px; }
        .period-label, .clock-label { font-size: 8px; }
        .clock { min-width: 46px; }
      }
    </style>
  </head>
  <body>
    <main class="broadcast" aria-label="Basketball broadcast">
      <div class="broadcast-screen" aria-hidden="true"></div>
      <div class="broadcast-label">NBA · Broadcast</div>

      <div class="shot-clock" aria-label="Shot clock: 9 seconds">
        <span>Shot clock</span>
        <strong>09</strong>
      </div>

      <section class="scorebug" aria-label="Toronto Raptors 117, Minnesota Timberwolves 112. Third quarter, 8 minutes 42 seconds remaining.">
        <div class="team home">
          <span class="team-accent" aria-hidden="true"></span>
          <div class="team-info">
            <div class="team-label">Toronto</div>
            <div class="team-name">Raptors</div>
          </div>
          <div class="score">117</div>
        </div>

        <div class="team away">
          <span class="team-accent" aria-hidden="true"></span>
          <div class="team-info">
            <div class="team-label">Minnesota</div>
            <div class="team-name">Timberwolves</div>
          </div>
          <div class="score">112</div>
        </div>

        <div class="game-state">
          <div class="period">
            <span class="period-label">Period</span>
            <span class="period-value">3rd</span>
          </div>
          <div class="clock">
            <span class="clock-label">Game clock</span>
            <span class="clock-value">8:42</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
